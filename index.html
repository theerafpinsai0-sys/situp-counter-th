<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หลับตานั่งสมาธิ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#0f0e17;--panel:#1a1830;--ink:#f5f2fb;--pink:#FF5FC0;--purple:#8B4FFF;--mint:#4FD1A5;--grad:linear-gradient(135deg,#FF5FC0,#8B4FFF);--shadow:0 10px 30px rgba(139,79,255,.25);--line:rgba(224,169,239,.15)}
*{box-sizing:border-box}html,body{margin:0}
body{background:
  radial-gradient(900px 500px at 110% -10%,rgba(255,95,192,.22),transparent 55%),
  radial-gradient(800px 520px at -15% 30%,rgba(139,79,255,.18),transparent 55%),
  radial-gradient(600px 400px at 50% 100%,rgba(79,209,165,.08),transparent 50%),
  var(--bg);background-attachment:fixed;color:var(--ink);font-family:'Prompt',system-ui,sans-serif;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 16px 8px}
h2{font-weight:800;font-size:20px;text-align:center;margin:4px 0 12px;letter-spacing:.3px}
.pill{display:block;margin:14px auto 0;background:var(--grad);color:#fff;border:0;border-radius:99px;font:800 18px/1.2 'Prompt',sans-serif;padding:16px 28px;text-align:center;width:100%;max-width:100%;box-shadow:0 12px 32px rgba(139,79,255,.35),0 0 0 1px rgba(255,255,255,.08) inset;cursor:pointer;min-height:56px;transition:transform .15s ease,box-shadow .2s ease;position:relative;overflow:hidden}
.pill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none;border-radius:inherit}
.pill:active{transform:scale(.97);box-shadow:0 6px 18px rgba(139,79,255,.25)}
.cam-wrap{position:relative;margin:6px 0 12px;border-radius:28px;padding:3px;background:conic-gradient(from var(--angle,0deg),#ff5fc0,#8b4fff,#4fd1a5,#ffe27a,#ff5fc0,#8b4fff,#ff5fc0);animation:spinBorder 3s linear infinite;aspect-ratio:4/3;max-height:40vh;box-shadow:0 0 24px rgba(255,95,192,.4),0 0 48px rgba(139,79,255,.2),0 16px 40px rgba(0,0,0,.3)}
@property --angle{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinBorder{to{--angle:360deg}}
.cam-wrap::before{content:'';position:absolute;inset:3px;border-radius:25px;background:#0f0e17;z-index:0}
video#v{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:25px;object-fit:cover;transform:scaleX(-1);z-index:2}
canvas#ov{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:25px;transform:scaleX(-1);pointer-events:none;z-index:3}
.cam-msg{position:absolute;left:12px;right:12px;top:12px;border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;background:rgba(15,14,23,.82);font-size:13px;line-height:1.4;z-index:4;backdrop-filter:blur(6px)}
.cam-msg.show{display:flex}
.timer{font-weight:800;font-size:64px;letter-spacing:3px;line-height:1.05;background:linear-gradient(135deg,#fff 0%,#FF5FC0 45%,#8B4FFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin:10px 0 6px;text-shadow:0 0 40px rgba(255,95,192,.25)}
.status-pill{display:table;margin:6px auto 4px;padding:7px 18px;border-radius:99px;font-size:13px;font-weight:600;letter-spacing:.2px;border:1px solid transparent}
.status-pill.idle{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.06)}
.status-pill.run{background:rgba(79,209,165,.15);color:var(--mint);border-color:rgba(79,209,165,.25);box-shadow:0 0 20px rgba(79,209,165,.15)}
.status-pill.warn{background:rgba(255,95,192,.12);color:#FF5FC0;border-color:rgba(255,95,192,.22);box-shadow:0 0 16px rgba(255,95,192,.12)}
.hint{display:none}
.sub{display:grid;grid-template-columns:1fr 1fr;background:rgba(26,24,48,.75);backdrop-filter:blur(12px);border-radius:24px;padding:16px 0;margin:14px 0 6px;text-align:center;border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.st b{display:block;font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.st span{font-size:12px;opacity:.55;margin-top:2px;display:block}.st+.st{border-left:1px solid rgba(255,255,255,.08)}
.panel{background:rgba(26,24,48,.8);backdrop-filter:blur(14px);border-radius:28px;padding:16px 8px 10px;box-shadow:0 12px 40px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06)}
.list{list-style:none;margin:0;padding:18px 0 0;max-height:58vh;overflow-y:auto}
.list li{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:8px;min-height:66px;border-bottom:1px solid rgba(255,255,255,.05);padding:6px 12px 6px 14px;position:relative;cursor:pointer;transition:background .15s}
.list li.me{background:rgba(255,95,192,.18);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,95,192,.25)}.list li.empty{opacity:.45;cursor:default}
.list li.top1{background:linear-gradient(90deg,rgba(255,160,40,.18),transparent 70%);border-radius:14px}
.list li.top1,.list li.top2,.list li.top3{isolation:isolate}
.list li.top1{--b:.34}
.list li.top2{--b:.22}
.list li.top3{--b:.16}
.list li.top1::before,.list li.top2::before,.list li.top3::before{content:'';position:absolute;left:0;right:0;top:-7px;bottom:-7px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,150,40,var(--b)) 0,rgba(255,150,40,0) 30%,rgba(255,150,40,0) 70%,rgba(255,150,40,var(--b)) 100%);animation:bandGlow 1.8s ease-in-out infinite alternate}
@keyframes bandGlow{0%{opacity:.65}100%{opacity:1}}
.list li.empty.top1,.list li.empty.top2,.list li.empty.top3{opacity:.75}
.rk{font-size:26px;text-align:center;font-weight:800}
.rk.r1,.rk.r2,.rk.r3{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:18px}
.rk.r1{background:linear-gradient(135deg,#FFE27A,#F5A100);color:#4a3000}
.rk.r2{background:linear-gradient(135deg,#EEF2F7,#98A4B5);color:#2b3340}
.rk.r3{background:linear-gradient(135deg,#F2B07A,#B5651D);color:#3b1d05}
.who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-weight:800;font-size:20px}.cnt::after{content:' นาที';font-size:12px;font-weight:400;opacity:.65}
.av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;position:relative}
.av.lg{width:88px;height:88px;font-size:36px}
.av.ring{padding:3px;background:conic-gradient(from var(--angle,0deg),#ff3b3b,#ff9a1f,#ffe14a,#4fe38a,#3fc6ff,#6a6cff,#c04fff,#ff5fc0,#ff3b3b);animation:spinBorder 2.5s linear infinite;box-shadow:-3px 0 10px rgba(255,90,90,.5),3px 0 10px rgba(80,170,255,.5),0 -3px 10px rgba(255,225,80,.45),0 3px 10px rgba(90,255,170,.45);overflow:visible;isolation:isolate}
.av.ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--panel);z-index:0}
.av.ring img,.av.ring .av-letter{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center}
.av.lg.ring{padding:4px;box-shadow:-5px 0 16px rgba(255,90,90,.55),5px 0 16px rgba(80,170,255,.55),0 -5px 16px rgba(255,225,80,.5),0 5px 16px rgba(90,255,170,.5)}
.av.lg.ring::after{inset:4px}
.list .av.ring{width:48px;height:48px;padding:3px}
.av.lg.ring::before,.list li.top1 .av.ring::before,.list li.top2 .av.ring::before,.list li.top3 .av.ring::before{content:'';position:absolute;inset:-5px;border-radius:50%;z-index:-1;pointer-events:none;background:conic-gradient(from var(--angle,0deg),#ff3b3b,#ff9a1f,#ffe14a,#4fe38a,#3fc6ff,#6a6cff,#c04fff,#ff5fc0,#ff3b3b);filter:blur(9px);opacity:.8;animation:spinBorder 2.5s linear infinite,ringFlicker 1.1s ease-in-out infinite alternate}
@keyframes ringFlicker{0%{opacity:.5;transform:scale(.94)}100%{opacity:.95;transform:scale(1.1)}}
.fire-rk{position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.fire-rk .rk{position:relative;z-index:3;width:40px;height:40px}
.fire-rk::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--fg) 0%,transparent 68%);filter:blur(5px);opacity:.75;z-index:0;pointer-events:none;animation:haloPulse 1.2s ease-in-out infinite alternate}
.fire-rk.r1{--f1:#fff6c4;--f2:#ffc83a;--f3:#ff6a00;--fg:rgba(255,140,0,.85);--fh:58px}
.fire-rk.r2{--f1:#ffffff;--f2:#dfe7f1;--f3:#8fa3bb;--fg:rgba(190,208,230,.75);--fh:46px}
.fire-rk.r3{--f1:#ffe6c6;--f2:#f2a45f;--f3:#b5551a;--fg:rgba(235,140,60,.8);--fh:40px}
.flame{position:absolute;left:50%;bottom:16px;width:52px;height:var(--fh,50px);margin-left:-26px;z-index:1;pointer-events:none;filter:drop-shadow(0 0 5px var(--fg))}
.flame i{position:absolute;bottom:0;border-radius:50% 50% 50% 50%/78% 78% 22% 22%;transform-origin:50% 100%;background:radial-gradient(ellipse 62% 72% at 50% 86%,var(--f1) 0%,var(--f2) 36%,var(--f3) 70%,transparent 100%);animation:flick var(--d,.9s) ease-in-out infinite alternate}
.flame i:nth-child(1){left:50%;width:24px;height:100%;margin-left:-12px;--d:.8s}
.flame i:nth-child(2){left:1px;width:20px;height:72%;--r:-12deg;--d:1.1s;animation-delay:-.3s}
.flame i:nth-child(3){right:1px;width:20px;height:78%;--r:11deg;--d:.95s;animation-delay:-.55s}
.flame i:nth-child(4){left:50%;width:13px;height:56%;margin-left:-6.5px;--d:.7s;animation-delay:-.2s}
.flame::before,.flame::after{content:'';position:absolute;left:30%;bottom:55%;width:4px;height:4px;border-radius:50%;background:var(--f1);box-shadow:0 0 6px var(--f3);opacity:0;animation:ember 1.7s ease-out infinite}
.flame::after{left:66%;--ex:-7px;animation-delay:.85s}
@keyframes flick{0%{transform:rotate(var(--r,0deg)) scale(1.06,.86)}100%{transform:rotate(calc(var(--r,0deg) + 5deg)) scale(.9,1.08)}}
@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--ex,7px),-30px) scale(.3);opacity:0}}
@keyframes haloPulse{0%{opacity:.5;transform:scale(.95)}100%{opacity:.9;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.flame i,.flame::before,.flame::after,.fire-rk::before,.list li.top1::before,.list li.top2::before,.list li.top3::before,.av.ring,.av.lg.ring::before,.list li.top1 .av.ring::before,.list li.top2 .av.ring::before,.list li.top3 .av.ring::before{animation:none !important}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-bg[hidden]{display:none !important}
.modal{background:linear-gradient(180deg,rgba(40,36,70,.95),rgba(22,20,40,.98));border-radius:28px;padding:28px 22px 24px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);text-align:center;position:relative;border:1px solid rgba(255,255,255,.08)}
.modal .close{position:absolute;top:12px;right:14px;border:0;background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.modal .av{margin:0 auto 12px}
.modal .uname{font-weight:800;font-size:22px;margin:4px 0}
.modal .meta{opacity:.75;font-size:14px;margin:4px 0 10px;line-height:1.5}
.modal .bio{background:rgba(0,0,0,.25);border-radius:16px;padding:12px;font-size:14px;line-height:1.5;min-height:40px;margin:8px 0 12px;text-align:left}
.modal .mins{font-weight:800;font-size:28px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
select,input[type=text],input[type=password],textarea{font:inherit;width:100%;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;min-height:48px;margin-top:8px;outline:none;transition:border-color .15s}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;gap:8px;margin-bottom:12px;background:rgba(0,0,0,.2);padding:5px;border-radius:99px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:800 14px 'Prompt',sans-serif;min-height:42px;border-radius:99px;cursor:pointer}
.seg .on{background:var(--grad);color:#fff}
.err{color:#ff7b9c;min-height:22px;font-size:14px;margin:8px 0 0}
.go{width:100%;margin-top:10px}
.who2{text-align:center}.who2 .av{margin:6px auto}
.seg3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;background:var(--panel);padding:6px;border-radius:99px;margin-bottom:12px}
.seg3 button{border:0;background:none;color:var(--ink);font:800 15px 'Prompt',sans-serif;min-height:46px;border-radius:99px;cursor:pointer}
.seg3 button.on{background:var(--grad);color:#fff}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),496px);transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;gap:4px;border-radius:28px;background:rgba(15,14,23,.88);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 1px rgba(139,79,255,.08);z-index:40}
nav .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 4px;border-radius:22px;font:700 12px 'Prompt',sans-serif;color:rgba(255,255,255,.55);border:0;background:transparent;cursor:pointer;transition:color .15s,background .15s}
nav .tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(139,79,255,.3)}
.tab::before{font-size:20px}#nHome::before{content:'🧘'}#nRank::before{content:'🏆'}#nAcc::before{content:'👤'}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.sm{font:700 14px 'Prompt',sans-serif;border:1px solid rgba(139,79,255,.4);background:rgba(139,79,255,.08);color:var(--ink);border-radius:99px;padding:8px 18px;min-height:40px;cursor:pointer;transition:background .15s}
.av-btn{position:relative;display:inline-block;cursor:pointer;border:0;background:none;padding:0}
.av-btn .av{width:88px;height:88px;font-size:36px}
.av-badge{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel);z-index:2}
</style>
</head>
<body>
<main>
<section id="pHome">
  <div class="cam-wrap">
    <video id="v" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="cam-msg" id="camMsg">กดปุ่มเริ่มด้านล่าง<br>แล้ววางมือถือให้เห็นใบหน้า<br>ระบบนับเวลาเฉพาะตอนหลับตา</div>
  </div>
  <div class="timer" id="timer">00:00</div>
  <div class="status-pill idle" id="status">พร้อมเริ่ม</div>
  <p class="hint" id="hint" hidden></p>
  <div class="sub">
    <div class="st"><b id="today">0</b><span>วันนี้ (นาที)</span></div>
    <div class="st"><b id="total">0</b><span>รวมทั้งหมด (นาที)</span></div>
  </div>
  <button class="pill" id="startBtn">เริ่มนั่งสมาธิ</button>
  <div class="row"><button class="sm" id="resetBtn" hidden>รีเซ็ตรอบนี้</button></div>
</section>
<section id="pRank" hidden>
  <div class="seg3">
    <button class="on" id="rkt">ประเทศไทย</button>
    <button id="rkr">ภาค</button>
    <button id="rkj">จังหวัด</button>
  </div>
  <div class="panel">
    <h2 id="rt">อันดับประเทศไทย</h2>
    <ol class="list" id="list"></ol>
  </div>
</section>
<section id="pAcc" hidden>
  <h2>ตั้งค่าบัญชี</h2>
  <div class="panel" style="padding:16px">
    <div id="authBox">
      <div class="seg">
        <button class="sm on" id="tLogin">เข้าสู่ระบบ</button>
        <button class="sm" id="tReg">สมัครสมาชิก</button>
      </div>
      <input type="text" id="au" placeholder="ชื่อผู้ใช้ (3-16 ตัวอักษร)" maxlength="16">
      <input type="password" id="ap" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)">
      <select id="ac" hidden></select>
      <div class="err" id="aMsg"></div>
      <button class="pill go" id="aGo">เข้าสู่ระบบ</button>
    </div>
    <div id="profBox" class="who2" hidden>
      <button type="button" class="av-btn" id="avBtn" title="เปลี่ยนรูปโปรไฟล์">
        <div id="pfAv" class="av lg ring">?</div>
        <span class="av-badge">📷</span>
      </button>
      <input type="file" id="avFile" accept="image/*" hidden>
      <div style="font-size:12px;opacity:.6;margin:4px 0 8px">แตะรูปเพื่อเปลี่ยน</div>
      <div style="font-weight:800;font-size:22px;margin:4px 0" id="pfName"></div>
      <div style="opacity:.7;margin-bottom:8px" id="pfEmail"></div>
      <select id="pc"></select>
      <textarea id="bioInput" maxlength="120" placeholder="เรารัก ธีรยอด"></textarea>
      <button class="sm" id="bioSave" style="margin-top:8px">บันทึกคำแนะนำตัว</button>
      <div class="row" style="margin-top:16px"><button class="sm" id="outBtn">ออกจากระบบ</button></div>
    </div>
  </div>
</section>
<div id="profModal" class="modal-bg" hidden>
  <div class="modal">
    <button class="close" id="pmClose" type="button">×</button>
    <div id="pmAv" class="av lg ring">?</div>
    <div class="uname" id="pmName">-</div>
    <div class="meta" id="pmMeta">-</div>
    <div class="bio" id="pmBio">เรารัก ธีรยอด</div>
    <div class="mins" id="pmMins">0 นาที</div>
  </div>
</div>
</main>
<nav>
  <button class="tab on" id="nHome">หน้าหลัก</button>
  <button class="tab" id="nRank">อันดับ</button>
  <button class="tab" id="nAcc">ตั้งค่าบัญชี</button>
</nav>
<script>
(function(){
  const sb = supabase.createClient(
    'https://ogppjkdgggkzcvopzhsx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ncHBqa2RnZ2dremN2b3B6aHN4'
