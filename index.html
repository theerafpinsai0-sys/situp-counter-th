<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นับลุกนั่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#C9D0DA;--ink:#0A0A0A;--pink:#FF5FC0;--lilac:#E0A9EF;--purple:#8B4FFF;--ok:#0b7a5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121C;--panel:#2C3342;--ink:#F5F2FB;--ok:#4FD1A5}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;padding-bottom:120px}
main{max-width:520px;margin:0 auto;padding:14px 18px}
h2{font-weight:800;font-size:22px;text-align:center;margin:6px 0 12px}
.pill{display:block;margin:0 auto;background:var(--panel);color:var(--ink);border:0;border-radius:99px;font:800 20px/1.2 'Prompt',sans-serif;padding:14px 28px;text-align:center;width:max-content;max-width:100%}
button.pill{cursor:pointer;min-height:48px}
.cam{position:relative;background:var(--panel);border-radius:28px;overflow:hidden;aspect-ratio:3/4;margin:16px 0;max-height:62vh;width:100%}
video,canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;padding:20px}
.msg.sm{font-size:15px}
.big{position:absolute;right:16px;bottom:8px;font-weight:800;font-size:84px;line-height:1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.state{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:3px 12px;font-size:13px}
.sub{text-align:center;margin:12px 0 6px;font-size:15px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sm{font:400 14px 'Prompt',sans-serif;border:2px solid var(--panel);background:none;color:var(--ink);border-radius:99px;padding:6px 16px;min-height:40px;cursor:pointer}
.panel{background:var(--panel);border-radius:28px;padding:16px 8px 8px}
.list{list-style:none;margin:0;padding:0;border-top:3px solid var(--ink);max-height:62vh;overflow-y:auto}
.list li{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;min-height:64px;border-bottom:3px solid var(--ink);padding:4px 10px 4px 0}
.list li.me{background:rgba(139,79,255,.22)}
.rk{font-size:30px;text-align:center}
.who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-weight:800;font-size:22px}
.av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:38px}
select,input[type=text],input[type=password]{font:inherit;width:100%;color:var(--ink);background:var(--bg);border:2px solid var(--panel);border-radius:14px;padding:10px 12px;min-height:46px;margin-top:8px}
.rank-sel{max-width:240px;margin:0 auto 12px;display:block;background:var(--panel);border-radius:99px;text-align:center}
.seg{display:flex;gap:8px;margin-bottom:6px}
.seg button{flex:1}
.seg .on{background:var(--purple);border-color:var(--purple);color:#fff}
.err{color:#d6336c;min-height:22px;font-size:14px;margin:8px 0 0}
.tip{font-size:13px;opacity:.75;margin:10px 0 0}
.go{width:100%;margin-top:10px;background:var(--purple);color:#fff}
.who2{text-align:center}
.who2 .av{margin:6px auto}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.tab{border:0;font:800 18px/1.2 'Prompt',sans-serif;color:#0A0A0A;min-height:78px;padding:6px 4px 14px;cursor:pointer;transition:min-height .15s}
.tab.on{min-height:106px}
#nHome{background:var(--pink)}#nRank{background:var(--lilac)}#nAcc{background:var(--purple)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}
:root{--grad:linear-gradient(135deg,#FF5FC0,#8B4FFF);--shadow:0 10px 30px rgba(139,79,255,.2)}
body{background:radial-gradient(700px 420px at 100% -8%,rgba(255,95,192,.25),transparent 60%),radial-gradient(700px 480px at -10% 40%,rgba(139,79,255,.2),transparent 60%),var(--bg);background-attachment:fixed}
.pill{box-shadow:var(--shadow)}
div.pill{background:var(--grad);color:#fff}
button.pill{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(255,95,192,.45);transition:transform .12s}
button.pill:active{transform:scale(.96)}
.cam{border:4px solid transparent;border-radius:32px;box-shadow:var(--shadow);background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box}
.panel{box-shadow:var(--shadow)}
.sub{font-weight:800;font-size:16px}
.fl{display:flex;gap:8px;margin-bottom:12px}
.fl select{margin:0;flex:1;min-width:0;border-radius:99px;background:var(--panel);border:0;text-align:center;font-weight:800;font-size:15px}
.nm{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.nm small{font-weight:400;opacity:.7;font-size:12px}
.rk.r1,.rk.r2,.rk.r3{width:40px;height:40px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.rk.r1{background:linear-gradient(135deg,#FFE27A,#F5A100);color:#4a3000}
.rk.r2{background:linear-gradient(135deg,#EEF2F7,#98A4B5);color:#2b3340}
.rk.r3{background:linear-gradient(135deg,#F2B07A,#B5651D);color:#3b1d05}
.list li.me{background:rgba(255,95,192,.25);border-radius:12px}
.av{box-shadow:0 2px 6px rgba(0,0,0,.2);background:var(--grad)}
nav{border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -8px 28px rgba(0,0,0,.18)}
.tab.on{border-radius:24px 24px 0 0}
.list li.empty{opacity:.45}
.seg3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;background:var(--panel);padding:6px;border-radius:99px;box-shadow:var(--shadow);margin-bottom:12px}
.seg3 button{border:0;background:none;color:var(--ink);font:800 16px 'Prompt',sans-serif;min-height:46px;border-radius:99px;cursor:pointer}
.seg3 button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,95,192,.4)}
.chip{display:block;margin:0 auto 12px;border:2px solid var(--purple);background:none;color:var(--ink);font:800 16px 'Prompt',sans-serif;border-radius:99px;padding:8px 22px;min-height:44px;cursor:pointer}
.chip::after{content:' ▾'}
.chip[hidden]{display:none}
.list li{position:relative}
.list li.fx{isolation:isolate}
.list li.fx::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(120% 95% at 50% 125%,var(--fa) 0%,var(--fb) 42%,transparent 74%);transform-origin:bottom;animation:flick var(--fs) ease-in-out infinite alternate}
.list li.fx.empty{opacity:.85}
.list li.f1{--fa:rgba(255,236,90,.95);--fb:rgba(255,90,0,.62);--fs:.32s;box-shadow:0 0 24px 4px rgba(255,110,0,.65)}
.list li.f2{--fa:rgba(255,175,60,.78);--fb:rgba(255,85,0,.4);--fs:.55s;box-shadow:0 0 14px 2px rgba(255,110,0,.4)}
.list li.f3{--fa:rgba(255,125,45,.58);--fb:rgba(220,60,0,.26);--fs:.85s;box-shadow:0 0 8px 1px rgba(255,100,0,.26)}
.f1 .cnt{text-shadow:0 0 12px #ffb300}
.f2 .cnt{text-shadow:0 0 8px #ff8a1f}
.f3 .cnt{text-shadow:0 0 5px #ff7a2a}
.rk.r1::after,.rk.r2::after,.rk.r3::after{display:none}
.list{padding-top:40px}
.fc{position:absolute;left:calc(50% - 50px);top:calc(50% - 66px);width:100px;height:100px;pointer-events:none;z-index:-1}
.list li{padding-left:14px}
.fire{position:absolute;inset:0;pointer-events:none;z-index:-1;filter:drop-shadow(0 0 5px rgba(255,140,0,.9))}
.fire i{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a))}
.fire b{position:absolute;bottom:var(--r);left:calc(var(--w) / -2);width:var(--w);height:calc(var(--h) * var(--k));transform-origin:50% 100%;background:linear-gradient(to top,var(--c1),var(--c2) 55%,var(--c3));clip-path:polygon(50% 0,78% 36%,100% 70%,84% 100%,16% 100%,0 70%,22% 36%);animation:lick var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.f1 .fire{--w:11px;--h:26px;--r:14px;--d:.33s;--c1:#FFF7B8;--c2:#FFA21F;--c3:#FF3B00}
.f2 .fire{--w:9px;--h:18px;--r:14px;--d:.5s;--c1:#FFE58A;--c2:#FF8A1F;--c3:#E23A00}
.f3 .fire{--w:7px;--h:12px;--r:14px;--d:.8s;--c1:#FFCB73;--c2:#FF7A2A;--c3:#C42E00}
@keyframes lick{0%{transform:scale(.8,.85) skewX(-6deg);opacity:.85}50%{transform:scale(1.05,1.18) skewX(5deg);opacity:1}100%{transform:scale(.92,1) skewX(-3deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.fire b{animation:none!important}}
.rk.r1,.rk.r2,.rk.r3{position:relative}
.rk.r1::after,.rk.r2::after,.rk.r3::after{content:'🔥';position:absolute;right:-9px;top:-13px;line-height:1;animation:flm .35s ease-in-out infinite alternate}
.rk.r1::after{font-size:28px}
.rk.r2::after{font-size:21px;animation-duration:.55s}
.rk.r3::after{font-size:15px;animation-duration:.85s}
@keyframes flick{0%{opacity:.72;transform:scaleY(.9)}50%{opacity:1;transform:scaleY(1.05)}100%{opacity:.8;transform:scaleY(.95)}}
@keyframes flm{from{transform:scale(.88) rotate(-7deg)}to{transform:scale(1.14) rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.list li.fx::before,.rk::after{animation:none!important}}
.rsum{text-align:center;font-size:14px;margin:0 0 10px;opacity:.85}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sc{background:var(--bg);width:100%;max-width:520px;max-height:82vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px;margin-bottom:12px}
.shh button{border:0;background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.opt{border:2px solid var(--panel);background:var(--panel);color:var(--ink);font:800 15px 'Prompt',sans-serif;border-radius:16px;padding:12px 8px;min-height:48px;cursor:pointer}
.opt.on{background:var(--grad);border-color:transparent;color:#fff}
.hd{font-weight:800;color:var(--purple);margin:8px 2px 6px}
.gbox{display:grid;gap:8px;margin-top:12px}
.gbox>.opt{padding:16px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.big.pop{animation:pop .35s;transform-origin:right bottom}
@media (prefers-reduced-motion:reduce){.big.pop{animation:none}button.pill{transition:none}}
/* polish */
:root{--panel:#EFE9FA;--line:rgba(139,79,255,.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2A2440;--line:rgba(224,169,239,.18)}}
body{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.msg[hidden]{display:none}
.msg:not(.sm){flex-direction:column;gap:10px;font-size:16px;line-height:1.5;opacity:.8}
.msg:not(.sm)::before{content:'📷';font-size:56px;line-height:1}
.big{background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:26px;padding:4px 20px 10px;right:12px;bottom:12px;font-size:76px}
.state{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px 14px}
#startBtn{min-height:56px;font-size:21px}
.sub{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:22px;padding:12px 0;margin:16px 0 4px}
.st+.st{border-left:1px solid var(--line)}
.st b{display:block;font-size:30px;line-height:1.15;font-weight:800}
.st span{font-size:13px;font-weight:400;opacity:.7}
.list{border-top:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.cnt::after{content:' ครั้ง';font-size:12px;font-weight:400;opacity:.65}
.rsum{display:table;margin:0 auto 12px;padding:4px 16px;border-radius:99px;background:var(--line);opacity:1}
.seg{background:var(--bg);padding:5px;border-radius:99px;margin-bottom:12px}
.seg .sm{border:0;min-height:42px;font-weight:800}
.seg .sm.on{background:var(--grad);box-shadow:0 6px 16px rgba(255,95,192,.4)}
#au,#ap,#ac,#pc{border-color:var(--line);border-radius:16px}
.go{min-height:52px;font-size:18px}
label.sm,.row .sm{border-color:rgba(139,79,255,.5);font-weight:800}
.opt{border-color:var(--line)}
.opt:active,.chip:active,.sm:active{transform:scale(.97)}
.sheet{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sc{box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.sc::before{content:'';display:block;width:42px;height:5px;border-radius:99px;background:var(--line);margin:-8px auto 12px}
nav{left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),496px);transform:translateX(-50%);padding:6px;gap:4px;align-items:stretch;border-radius:30px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 10px 34px rgba(139,79,255,.28);overflow:visible}
nav .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;border-radius:24px;font-size:13px;color:var(--ink);transition:background .2s,color .2s}
nav .tab.on{min-height:58px;border-radius:24px}
nav #nHome,nav #nRank,nav #nAcc{background:transparent}
nav #nHome.on,nav #nRank.on,nav #nAcc.on{background:linear-gradient(135deg,#E83FA8,#7A3CF0);color:#fff;box-shadow:0 6px 16px rgba(232,63,168,.4)}
.tab::before{font-size:20px;line-height:1}
#nHome::before{content:'🏠'}#nRank::before{content:'🏆'}#nAcc::before{content:'👤'}
/* rainbow ring */
.ar{position:relative;display:flex;flex:none;padding:5px;border-radius:50%}
.ar::before,.ar::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff3b3b,#ff9f1a,#ffe14d,#3be37a,#2fc4ff,#7a5cff,#ff4fd8,#ff3b3b);animation:arspin 2.4s linear infinite;will-change:transform}
.ar::after{inset:-2px;filter:blur(7px);opacity:.8}
.ar .av{position:relative;z-index:1;box-shadow:0 0 0 2px var(--panel)}
.list li.empty,.list li.fx.empty{opacity:1}
.list li.empty .rk,.list li.empty .nm,.list li.empty .cnt{opacity:.55}
.who2 .ar{width:max-content;margin:6px auto}
.who2 .ar .av{margin:0}
@keyframes arspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ar::before,.ar::after{animation:none}}
/* rainbow camera frame */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.camw{position:relative;margin:16px 0;border-radius:32px}
.cam{margin:0;z-index:1;box-shadow:none;background:var(--panel) padding-box}
.camw::before,.camw::after{content:'';position:absolute;inset:0;border-radius:32px;background:conic-gradient(from var(--ang),#ff3b3b,#ff9f1a,#ffe14d,#3be37a,#2fc4ff,#7a5cff,#ff4fd8,#ff3b3b);animation:camspin 3.2s linear infinite}
.camw::after{filter:blur(14px);opacity:.75}
@keyframes camspin{to{--ang:360deg}}
@media (prefers-reduced-motion:reduce){.camw::before,.camw::after{animation:none}}
</style>
</head>
<body>
<main>

<section id="pHome">
  <div class="pill">จำนวนการลุกนั่ง</div>
  <div class="camw"><div class="cam">
    <video id="v" playsinline muted></video>
    <canvas class="ov" id="ov" width="80" height="60"></canvas>
    <div class="msg" id="msg">กดเริ่มลุกนั่ง แล้ววางมือถือให้เห็นตัวทั้งตัว</div>
    <div class="state" id="state" hidden></div>
    <div class="big" id="big">0</div>
  </div>
  </div><button class="pill" id="startBtn">เริ่มลุกนั่ง</button>
  <div class="sub" id="sub"></div>
  
</section>

<section id="pRank" hidden>
  <div id="gate" hidden></div>
  <div id="rbody">
  <div class="seg3"><button class="on" id="rkt">ประเทศไทย</button><button id="rkr">ภาค</button><button id="rkj">จังหวัด</button></div>
  <button class="chip" id="chip" hidden></button>
  <div class="panel">
    <h2 id="rt">อันดับประเทศไทย</h2>
    <div class="rsum" id="rsum"></div>
    <ol class="list" id="list"></ol>
  </div>
  </div>
  <p class="tip" id="rnote"></p>
</section>

<section id="pAcc" hidden>
  <h2>ตั้งค่าบัญชี</h2>
  <div class="panel" style="padding:16px">
    <div id="authBox">
      <div class="seg">
        <button class="sm on" id="tLogin">เข้าสู่ระบบ</button>
        <button class="sm" id="tReg">สมัครสมาชิก</button>
      </div>
      <input type="text" id="au" placeholder="ชื่อผู้ใช้ (3-16 ตัวอักษร)" maxlength="16" autocomplete="username" aria-label="ชื่อผู้ใช้">
      <input type="password" id="ap" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="current-password" aria-label="รหัสผ่าน">
      <select id="ac" aria-label="จังหวัดของคุณ" hidden></select>
      <div class="err" id="aMsg" role="alert"></div>
      <button class="pill go" id="aGo">เข้าสู่ระบบ</button>
    </div>
    <div id="profBox" class="who2" hidden>
      <div id="pfAv"></div>
      <div style="font-weight:800;font-size:22px" id="pfName"></div>
      <select id="pc" aria-label="จังหวัดของคุณ"></select>
      <label class="sm" style="display:inline-block;margin-top:10px">เปลี่ยนรูปโปรไฟล์<input type="file" id="pf" accept="image/*" hidden></label>
      <div class="row"><button class="sm" id="outBtn">ออกจากระบบ</button></div>
    </div>
  </div>
  
</section>

</main>
<nav>
  <button class="tab on" id="nHome">หน้าหลัก</button>
  <button class="tab" id="nRank">อันดับ</button>
  <button class="tab" id="nAcc">ตั้งค่าบัญชี</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sc"><div class="shh"><span id="shT"></span><button id="shX" aria-label="ปิด">✕</button></div><div id="shL"></div></div></div>

<script>

</script>
</body>
</html>
