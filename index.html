<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หลับตานั่งสมาธิ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
:root{--bg:#0f0e17;--panel:#1a1830;--ink:#f5f2fb;--pink:#FF5FC0;--purple:#8B4FFF;--mint:#4FD1A5;--grad:linear-gradient(135deg,#FF5FC0,#8B4FFF);--shadow:0 10px 30px rgba(139,79,255,.25);--line:rgba(224,169,239,.15)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 500px at 110% -10%,rgba(255,95,192,.22),transparent 55%),radial-gradient(800px 520px at -15% 30%,rgba(139,79,255,.18),transparent 55%),radial-gradient(600px 400px at 50% 100%,rgba(79,209,165,.08),transparent 50%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:'Prompt',system-ui,sans-serif;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 16px 8px}
h2{font-weight:800;font-size:20px;text-align:center;margin:4px 0 12px;letter-spacing:.3px}
.pill{display:block;margin:14px auto 0;background:var(--grad);color:#fff;border:0;border-radius:99px;font:800 18px/1.2 'Prompt',sans-serif;padding:16px 28px;text-align:center;width:100%;max-width:100%;box-shadow:0 12px 32px rgba(139,79,255,.35),0 0 0 1px rgba(255,255,255,.08) inset;cursor:pointer;min-height:56px;transition:transform .15s ease,box-shadow .2s ease;position:relative;overflow:hidden}
.pill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none;border-radius:inherit}
.pill:active{transform:scale(.97)}
.cam-wrap{position:relative;margin:6px 0 12px;border-radius:28px;padding:3px;background:conic-gradient(from var(--angle,0deg),#ff5fc0,#8b4fff,#4fd1a5,#ffe27a,#ff5fc0,#8b4fff,#ff5fc0);animation:spinBorder 3s linear infinite;aspect-ratio:4/3;max-height:40vh;box-shadow:0 0 24px rgba(255,95,192,.4),0 0 48px rgba(139,79,255,.2),0 16px 40px rgba(0,0,0,.3)}
@property --angle{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinBorder{to{--angle:360deg}}
.cam-wrap::before{content:'';position:absolute;inset:3px;border-radius:25px;background:#0f0e17;z-index:0}
video#v{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:25px;object-fit:cover;transform:scaleX(-1);z-index:2}
canvas#ov{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:25px;transform:scaleX(-1);pointer-events:none;z-index:3}
.cam-msg{position:absolute;left:12px;right:12px;top:12px;border-radius:16px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;background:rgba(15,14,23,.82);font-size:13px;line-height:1.4;z-index:4;backdrop-filter:blur(6px)}
.cam-msg.show{display:flex}
.timer{font-weight:800;font-size:64px;letter-spacing:3px;line-height:1.05;background:linear-gradient(135deg,#fff 0%,#FF5FC0 45%,#8B4FFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin:10px 0 6px}
.status-pill{display:table;margin:6px auto 4px;padding:7px 18px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid transparent}
.status-pill.idle{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.06)}
.status-pill.run{background:rgba(79,209,165,.15);color:var(--mint);border-color:rgba(79,209,165,.25)}
.status-pill.warn{background:rgba(255,95,192,.12);color:#FF5FC0;border-color:rgba(255,95,192,.22)}
.hint{display:none}
.sub{display:grid;grid-template-columns:1fr 1fr;background:rgba(26,24,48,.75);backdrop-filter:blur(12px);border-radius:24px;padding:16px 0;margin:14px 0 6px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.st b{display:block;font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.st span{font-size:12px;opacity:.55;margin-top:2px;display:block}.st+.st{border-left:1px solid rgba(255,255,255,.08)}
.panel{background:rgba(26,24,48,.8);backdrop-filter:blur(14px);border-radius:28px;padding:16px 8px 10px;box-shadow:0 12px 40px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06)}
.list{list-style:none;margin:0;padding:18px 0 0;max-height:58vh;overflow-y:auto}
.list li{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:8px;min-height:66px;border-bottom:1px solid rgba(255,255,255,.05);padding:6px 12px 6px 14px;position:relative;cursor:pointer}
.list li.me{background:rgba(255,95,192,.18);border-radius:14px}.list li.empty{opacity:.45;cursor:default}
.list li.top1{background:linear-gradient(90deg,rgba(255,160,40,.18),transparent 70%);border-radius:14px}
.list li.top1,.list li.top2,.list li.top3{isolation:isolate}
.list li.top1{--b:.34}.list li.top2{--b:.22}.list li.top3{--b:.16}
.list li.top1::before,.list li.top2::before,.list li.top3::before{content:'';position:absolute;left:0;right:0;top:-7px;bottom:-7px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,150,40,var(--b)) 0,rgba(255,150,40,0) 30%,rgba(255,150,40,0) 70%,rgba(255,150,40,var(--b)) 100%);animation:bandGlow 1.8s ease-in-out infinite alternate}
@keyframes bandGlow{0%{opacity:.65}100%{opacity:1}}
.rk{font-size:26px;text-align:center;font-weight:800}
.rk.r1,.rk.r2,.rk.r3{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:18px}
.rk.r1{background:linear-gradient(135deg,#FFE27A,#F5A100);color:#4a3000}
.rk.r2{background:linear-gradient(135deg,#EEF2F7,#98A4B5);color:#2b3340}
.rk.r3{background:linear-gradient(135deg,#F2B07A,#B5651D);color:#3b1d05}
.who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-weight:800;font-size:20px}.cnt::after{content:' นาที';font-size:12px;font-weight:400;opacity:.65}
.av{width:40px;height:40px;border-radius:50%;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;position:relative}
.av.lg{width:88px;height:88px;font-size:36px}
.av.ring{padding:3px;background:conic-gradient(from var(--angle,0deg),#ff3b3b,#ff9a1f,#ffe14a,#4fe38a,#3fc6ff,#6a6cff,#c04fff,#ff5fc0,#ff3b3b);animation:spinBorder 2.5s linear infinite;box-shadow:-3px 0 10px rgba(255,90,90,.5),3px 0 10px rgba(80,170,255,.5),0 -3px 10px rgba(255,225,80,.45),0 3px 10px rgba(90,255,170,.45);overflow:visible;isolation:isolate}
.av.ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--panel);z-index:0}
.av.ring img,.av.ring .av-letter{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center}
.av.lg.ring{padding:4px}.av.lg.ring::after{inset:4px}
.list .av.ring{width:48px;height:48px;padding:3px}
.av.lg.ring::before,.list li.top1 .av.ring::before,.list li.top2 .av.ring::before,.list li.top3 .av.ring::before{content:'';position:absolute;inset:-5px;border-radius:50%;z-index:-1;pointer-events:none;background:conic-gradient(from var(--angle,0deg),#ff3b3b,#ff9a1f,#ffe14a,#4fe38a,#3fc6ff,#6a6cff,#c04fff,#ff5fc0,#ff3b3b);filter:blur(9px);opacity:.8;animation:spinBorder 2.5s linear infinite,ringFlicker 1.1s ease-in-out infinite alternate}
@keyframes ringFlicker{0%{opacity:.5;transform:scale(.94)}100%{opacity:.95;transform:scale(1.1)}}
.fire-rk{position:relative;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.fire-rk .rk{position:relative;z-index:3;width:40px;height:40px}
.fire-rk::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--fg) 0%,transparent 68%);filter:blur(5px);opacity:.75;z-index:0;pointer-events:none;animation:haloPulse 1.2s ease-in-out infinite alternate}
.fire-rk.r1{--f1:#fff6c4;--f2:#ffc83a;--f3:#ff6a00;--fg:rgba(255,140,0,.85);--fh:58px}
.fire-rk.r2{--f1:#ffffff;--f2:#dfe7f1;--f3:#8fa3bb;--fg:rgba(190,208,230,.75);--fh:46px}
.fire-rk.r3{--f1:#ffe6c6;--f2:#f2a45f;--f3:#b5551a;--fg:rgba(235,140,60,.8);--fh:40px}
.flame{position:absolute;left:50%;bottom:16px;width:52px;height:var(--fh,50px);margin-left:-26px;z-index:1;pointer-events:none;filter:drop-shadow(0 0 5px var(--fg))}
.flame i{position:absolute;bottom:0;border-radius:50% 50% 50% 50%/78% 78% 22% 22%;transform-origin:50% 100%;background:radial-gradient(ellipse 62% 72% at 50% 86%,var(--f1) 0%,var(--f2) 36%,var(--f3) 70%,transparent 100%);animation:flick var(--d,.9s) ease-in-out infinite alternate}
.flame i:nth-child(1){left:50%;width:24px;height:100%;margin-left:-12px;--d:.8s}
.flame i:nth-child(2){left:1px;width:20px;height:72%;--r:-12deg;--d:1.1s;animation-delay:-.3s}
.flame i:nth-child(3){right:1px;width:20px;height:78%;--r:11deg;--d:.95s;animation-delay:-.55s}
.flame i:nth-child(4){left:50%;width:13px;height:56%;margin-left:-6.5px;--d:.7s;animation-delay:-.2s}
.flame::before,.flame::after{content:'';position:absolute;left:30%;bottom:55%;width:4px;height:4px;border-radius:50%;background:var(--f1);box-shadow:0 0 6px var(--f3);opacity:0;animation:ember 1.7s ease-out infinite}
.flame::after{left:66%;--ex:-7px;animation-delay:.85s}
@keyframes flick{0%{transform:rotate(var(--r,0deg)) scale(1.06,.86)}100%{transform:rotate(calc(var(--r,0deg) + 5deg)) scale(.9,1.08)}}
@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--ex,7px),-30px) scale(.3);opacity:0}}
@keyframes haloPulse{0%{opacity:.5;transform:scale(.95)}100%{opacity:.9;transform:scale(1.12)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.modal-bg[hidden]{display:none !important}
.modal{background:linear-gradient(180deg,rgba(40,36,70,.95),rgba(22,20,40,.98));border-radius:28px;padding:28px 22px 24px;max-width:360px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center;position:relative;border:1px solid rgba(255,255,255,.08)}
.modal .close{position:absolute;top:12px;right:14px;border:0;background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer}
.modal .av{margin:0 auto 12px}
.modal .uname{font-weight:800;font-size:22px;margin:4px 0}
.modal .meta{opacity:.75;font-size:14px;margin:4px 0 10px}
.modal .bio{background:rgba(0,0,0,.25);border-radius:16px;padding:12px;font-size:14px;line-height:1.5;min-height:40px;margin:8px 0 12px;text-align:left}
.modal .mins{font-weight:800;font-size:28px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
select,input[type=text],input[type=password],textarea{font:inherit;width:100%;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;min-height:48px;margin-top:8px;outline:none}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;gap:8px;margin-bottom:12px;background:rgba(0,0,0,.2);padding:5px;border-radius:99px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:800 14px 'Prompt',sans-serif;min-height:42px;border-radius:99px;cursor:pointer}
.seg .on{background:var(--grad);color:#fff}
.err{color:#ff7b9c;min-height:22px;font-size:14px;margin:8px 0 0}
.go{width:100%;margin-top:10px}
.who2{text-align:center}.who2 .av{margin:6px auto}
.seg3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;background:var(--panel);padding:6px;border-radius:99px;margin-bottom:12px}
.seg3 button{border:0;background:none;color:var(--ink);font:800 15px 'Prompt',sans-serif;min-height:46px;border-radius:99px;cursor:pointer}
.seg3 button.on{background:var(--grad);color:#fff}
.rsum{display:table;margin:0 auto 12px;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.7)}
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),496px);transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;gap:4px;border-radius:28px;background:rgba(15,14,23,.88);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.35);z-index:40}
nav .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 4px;border-radius:22px;font:700 12px 'Prompt',sans-serif;color:rgba(255,255,255,.55);border:0;background:transparent;cursor:pointer}
nav .tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(139,79,255,.3)}
.tab::before{font-size:20px}#nHome::before{content:'🧘'}#nRank::before{content:'🏆'}#nAcc::before{content:'👤'}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.sm{font:700 14px 'Prompt',sans-serif;border:1px solid rgba(139,79,255,.4);background:rgba(139,79,255,.08);color:var(--ink);border-radius:99px;padding:8px 18px;min-height:40px;cursor:pointer}
.av-btn{position:relative;display:inline-block;cursor:pointer;border:0;background:none;padding:0}
.av-btn .av{width:88px;height:88px;font-size:36px}
.av-badge{position:absolute;right:0;bottom:0;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel);z-index:2}
</style>
</head>
<body>
<main>
<section id="pHome">
  <div class="cam-wrap">
    <video id="v" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="cam-msg" id="camMsg">กดปุ่มเริ่มด้านล่าง<br>แล้ววางมือถือให้เห็นใบหน้า<br>ระบบนับเวลาเฉพาะตอนหลับตา</div>
  </div>
  <div class="timer" id="timer">00:00</div>
  <div class="status-pill idle" id="status">พร้อมเริ่ม</div>
  <div class="sub">
    <div class="st"><b id="today">0</b><span>วันนี้ (นาที)</span></div>
    <div class="st"><b id="total">0</b><span>รวมทั้งหมด (นาที)</span></div>
  </div>
  <button class="pill" id="startBtn">เริ่มนั่งสมาธิ</button>
  <div class="row"><button class="sm" id="resetBtn" hidden>รีเซ็ตรอบนี้</button></div>
</section>
<section id="pRank" hidden>
  <div class="seg3">
    <button class="on" id="rkt">ประเทศไทย</button>
    <button id="rkr">ภาค</button>
    <button id="rkj">จังหวัด</button>
  </div>
  <div class="panel">
    <h2 id="rt">อันดับประเทศไทย</h2>
    <div class="rsum" id="rsum">กำลังโหลด...</div>
    <ol class="list" id="list"></ol>
  </div>
</section>
<section id="pAcc" hidden>
  <h2>ตั้งค่าบัญชี</h2>
  <div class="panel" style="padding:16px">
    <div id="authBox">
      <div class="seg">
        <button class="sm on" id="tLogin">เข้าสู่ระบบ</button>
        <button class="sm" id="tReg">สมัครสมาชิก</button>
      </div>
      <input type="text" id="au" placeholder="ชื่อผู้ใช้ (ภาษาไทยได้ เช่น ธีรยอด)" maxlength="24">
      <input type="password" id="ap" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)">
      <select id="ac" hidden></select>
      <div class="err" id="aMsg"></div>
      <button class="pill go" id="aGo">เข้าสู่ระบบ</button>
    </div>
    <div id="profBox" class="who2" hidden>
      <button type="button" class="av-btn" id="avBtn" title="เปลี่ยนรูปโปรไฟล์">
        <div id="pfAv" class="av lg ring">?</div>
        <span class="av-badge">📷</span>
      </button>
      <input type="file" id="avFile" accept="image/*" hidden>
      <div style="font-size:12px;opacity:.6;margin:4px 0 8px">แตะรูปเพื่อเปลี่ยน</div>
      <div style="font-weight:800;font-size:22px;margin:4px 0" id="pfName"></div>
      <div style="opacity:.7;margin-bottom:8px" id="pfEmail"></div>
      <select id="pc"></select>
      <textarea id="bioInput" maxlength="120" placeholder="เรารัก ธีรยอด"></textarea>
      <button class="sm" id="bioSave" style="margin-top:8px">บันทึกคำแนะนำตัว</button>
      <div class="row" style="margin-top:16px"><button class="sm" id="outBtn">ออกจากระบบ</button></div>
    </div>
  </div>
</section>
<div id="profModal" class="modal-bg" hidden>
  <div class="modal">
    <button class="close" id="pmClose" type="button">×</button>
    <div id="pmAv" class="av lg ring">?</div>
    <div class="uname" id="pmName">-</div>
    <div class="meta" id="pmMeta">-</div>
    <div class="bio" id="pmBio">เรารัก ธีรยอด</div>
    <div class="mins" id="pmMins">0 นาที</div>
  </div>
</div>
</main>
<nav>
  <button class="tab on" id="nHome">หน้าหลัก</button>
  <button class="tab" id="nRank">อันดับ</button>
  <button class="tab" id="nAcc">ตั้งค่าบัญชี</button>
</nav>

    'ภาคตะวันออกเฉียงเหนือ':'กาฬสินธุ์ ขอนแก่น ชัยภูมิ นครพนม นครราชสีมา บึงกาฬ บุรีรัมย์ มหาสารคาม มุกดาหาร ยโสธร ร้อยเอ็ด เลย สกลนคร สุรินทร์ ศรีสะเกษ หนองคาย หนองบัวลำภู อำนาจเจริญ อุดรธานี อุบลราชธานี',
    'ภาคตะวันออก':'จันทบุรี ฉะเชิงเทรา ชลบุรี ตราด ปราจีนบุรี ระยอง สระแก้ว',
    'ภาคตะวันตก':'กาญจนบุรี ตาก ประจวบคีรีขันธ์ เพชรบุรี ราชบุรี',
    'ภาคใต้':'กระบี่ ชุมพร ตรัง นครศรีธรรมราช นราธิวาส ปัตตานี พังงา พัทลุง ภูเก็ต ระนอง สงขลา สตูล สุราษฎร์ธานี ยะลา'
  };
  const RN = Object.keys(REG);
  const PR = {};
  RN.forEach(function(r){ REG[r].split(' ').forEach(function(p){ PR[p]=r; }); });
  function $(id){ return document.getElementById(id); }
  var FLAME = '<span class="flame"><i></i><i></i><i></i><i></i></span>';
  var DEFAULT_BIO = 'เรารัก ธีรยอด';

  var user = null, profile = null;
  var data = { total: 0, today: 0 };
  var rows = [], rankMode = 'th', selRegion = '', selProv = '';
  var running = false, closedMs = 0, lastTick = 0, lastSavedMin = 0;
  var eyesClosed = false, faceOk = false, stream = null, faceMesh = null, rafId = null;
  var LEFT_EYE = [33, 160, 158, 133, 153, 144];
  var RIGHT_EYE = [362, 385, 387, 263, 373, 380];
  var EAR_THRESH = 0.16, closedFrames = 0, openFrames = 0;

  function dkey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function loadLocal(){ try{ var s=localStorage.getItem('meditate_v2'); if(s) data=JSON.parse(s);}catch(e){} if(!data.days) data.days={}; data.today=data.days[dkey()]||0; }
  function saveLocal(){ data.days=data.days||{}; data.days[dkey()]=data.today; try{ localStorage.setItem('meditate_v2', JSON.stringify(data)); }catch(e){} if(user){ try{ localStorage.setItem('meditate_today_'+user.id, String(data.today)); }catch(e){} } }
  function fmt(ms){ var t=Math.floor(ms/1000); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

  function go(p){ closeProfile(); ['Home','Rank','Acc'].forEach(function(n){ $('p'+n).hidden=(n!==p); $('n'+n).className='tab'+(n===p?' on':''); }); if(p==='Acc') renderAcc(); if(p==='Rank') loadLeaderboard(); }
  ['Home','Rank','Acc'].forEach(function(n){ $('n'+n).onclick=function(){ go(n); }; });

  function amsg(t){ $('aMsg').textContent=t||''; }
  function fillProv(sel){ sel.innerHTML=''; var ph=document.createElement('option'); ph.value=''; ph.textContent='เลือกจังหวัดของคุณ'; sel.appendChild(ph); RN.forEach(function(r){ var g=document.createElement('optgroup'); g.label=r; REG[r].split(' ').forEach(function(p){ var o=document.createElement('option'); o.value=p; o.textContent=p; g.appendChild(o); }); sel.appendChild(g); }); }
  fillProv($('ac')); fillProv($('pc'));

  var mode='login';
  $('tLogin').onclick=function(){ mode='login'; $('tLogin').className='sm on'; $('tReg').className='sm'; $('ac').hidden=true; $('aGo').textContent='เข้าสู่ระบบ'; amsg(''); };
  $('tReg').onclick=function(){ mode='reg'; $('tReg').className='sm on'; $('tLogin').className='sm'; $('ac').hidden=false; $('aGo').textContent='สมัครสมาชิก'; amsg(''); };

  function toEmail(u){
    var s = String(u||'').trim().toLowerCase();
    var ascii = s.replace(/[^a-z0-9]/g,'');
    if(ascii.length >= 3) return ascii + '@meditate.app';
    var h = 0;
    for(var i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
    return 'u' + (h>>>0).toString(16) + '@meditate.app';
  }

  $('aGo').onclick=async function(){
    var uname=$('au').value.trim(), pass=$('ap').value; amsg('');
    if(!uname||uname.length<2||uname.length>24){ amsg('ชื่อผู้ใช้ต้องมี 2-24 ตัวอักษร (ใช้ภาษาไทยได้)'); return; }
    if(!/^[\u0E00-\u0E7Fa-zA-Z0-9_.\- ]+$/.test(uname)){ amsg('ใช้ได้เฉพาะภาษาไทย อังกฤษ ตัวเลข'); return; }
    if(!pass||pass.length<6){ amsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัว'); return; }
    $('aGo').disabled=true; var email=toEmail(uname);
    try{
      if(mode==='reg'){
        var prov=$('ac').value; if(!prov){ amsg('เลือกจังหวัดของคุณก่อน'); return; }
        var existRes=await sb.from('profiles').select('id').ilike('username',uname).maybeSingle();
        if(existRes.data){ amsg('ชื่อผู้ใช้นี้มีคนใช้แล้ว'); return; }
        var authRes=await sb.auth.signUp({email:email,password:pass}); if(authRes.error) throw authRes.error;
        await sb.from('profiles').upsert({id:authRes.data.user.id,email:email,username:uname,province:prov,region:PR[prov]||'',total_situps:0,bio:DEFAULT_BIO,updated_at:new Date().toISOString()});
        data.total=0; data.today=0; data.days={}; saveLocal(); amsg('สมัครสำเร็จ!');
      } else {
        var look=await sb.from('profiles').select('email').ilike('username',uname).maybeSingle();
        var tryEmails=[];
        if(look.data&&look.data.email) tryEmails.push(look.data.email);
        tryEmails.push(email);
        var loginRes=null, lastErr=null;
        for(var i=0;i<tryEmails.length;i++){
          loginRes=await sb.auth.signInWithPassword({email:tryEmails[i],password:pass});
          if(!loginRes.error) break;
          lastErr=loginRes.error;
        }
        if(!loginRes||loginRes.error) throw (lastErr||loginRes.error);
      }
      await refreshUser(); $('ap').value='';
    }catch(e){ var msg=e.message||'เกิดข้อผิดพลาด'; if(msg.indexOf('Invalid login')>=0) msg='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; if(msg.indexOf('already registered')>=0) msg='ชื่อผู้ใช้นี้มีคนใช้แล้ว'; amsg(msg); }
    finally{ $('aGo').disabled=false; }
  };

  $('outBtn').onclick=async function(){ if(running) stopSession(true); await sb.auth.signOut(); user=null; profile=null; data.total=0; data.today=0; renderHome(); renderAcc(); };
  $('pc').onchange=async function(){ if(!user||!profile) return; var prov=$('pc').value; await sb.from('profiles').update({province:prov,region:PR[prov]||'',updated_at:new Date().toISOString()}).eq('id',user.id); profile.province=prov; profile.region=PR[prov]||''; renderAcc(); };

  async function refreshUser(){
    var res=await sb.auth.getUser(); user=res.data.user;
    if(user){ var pr=await sb.from('profiles').select('*').eq('id',user.id).single(); profile=pr.data;
      if(profile){ data.total=profile.total_situps||0; try{ var t=localStorage.getItem('meditate_today_'+user.id); data.today=t?(parseFloat(t)||0):0; }catch(e){ data.today=0; } saveLocal(); renderHome(); }
    } else profile=null;
    renderAcc();
  }
  function setAvatarEl(el,url,letter){
    if(!el) return;
    el.classList.add('ring');
    if(url){ el.innerHTML='<img src="'+url+'" alt="">'; el.style.background=''; }
    else { el.innerHTML='<span class="av-letter">'+(letter||'?')+'</span>'; el.style.background=''; }
  }

  async function loadLeaderboard(){
    $('rsum').textContent='กำลังโหลด...'; $('list').innerHTML='';
    var q=sb.from('profiles').select('id,username,province,region,total_situps,avatar_url,bio').order('total_situps',{ascending:false}).limit(100);
    if(rankMode==='region'&&selRegion) q=q.eq('region',selRegion);
    if(rankMode==='prov'&&selProv) q=q.eq('province',selProv);
    var res=await q; if(res.error){ console.warn(res.error); return; } rows=res.data||[]; renderRank();
  }
  function renderRank(){
    var filtered=rows.filter(function(r){ return (r.total_situps||0)>0; });
    var totalShow=100;
    var sumMin=filtered.reduce(function(a,x){return a+(x.total_situps||0);},0);
    $('rsum').textContent=filtered.length?(filtered.length+' คน · รวม '+Math.round(sumMin)+' นาที'):'ยังไม่มีผู้เล่น';
    $('list').innerHTML='';
    for(var i=0;i<totalShow;i++){
      var r=filtered[i]; var li=document.createElement('li');
      if(i<3) li.classList.add('top'+(i+1));
      if(r&&user&&r.id===user.id) li.classList.add('me');
      if(!r) li.classList.add('empty');
      var rk=i===0?'r1':i===1?'r2':i===2?'r3':'';
      if(r){
        var letter=(r.username||'?')[0].toUpperCase();
        var avInner=r.avatar_url?('<img src="'+r.avatar_url+'" alt="">'):('<span class="av-letter">'+letter+'</span>');
        var avHtml='<div class="av ring">'+avInner+'</div>';
        var flame=(i<3)?FLAME:'';
        var rkHtml=(i<3)?('<div class="fire-rk '+(i===0?'r1':i===1?'r2':'r3')+'">'+flame+'<div class="rk '+rk+'">'+(i+1)+'</div></div>'):('<div class="rk">'+(i+1)+'</div>');
        li.innerHTML=rkHtml+'<div class="who">'+avHtml+'<span>'+(r.username||'ไม่ระบุ')+'<br><small style="font-weight:400;opacity:.7">'+(r.province||'')+'</small></span></div><div class="cnt">'+Math.round(r.total_situps||0)+'</div>';
        (function(row){ li.onclick=function(){ showProfile(row); }; })(r);
      } else {
        var emptyAv='<div class="av ring" style="opacity:.45"><span class="av-letter">-</span></div>';
        var flame=(i<3)?FLAME:'';
        var rkHtml=(i<3)?('<div class="fire-rk '+(i===0?'r1':i===1?'r2':'r3')+'">'+flame+'<div class="rk '+rk+'">'+(i+1)+'</div></div>'):('<div class="rk">'+(i+1)+'</div>');
        li.innerHTML=rkHtml+'<div class="who">'+emptyAv+'<span style="opacity:.45">ว่าง<br><small>รอคุณมาเป็นอันดับนี้</small></span></div><div class="cnt" style="opacity:.3">-</div>';
      }
      $('list').appendChild(li);
    }
    $('rt').textContent=rankMode==='th'?'อันดับประเทศไทย':rankMode==='region'?'อันดับภาค':'อันดับจังหวัด';
  }
  $('rkt').onclick=function(){ rankMode='th'; selRegion=''; selProv=''; $('rkt').className='on'; $('rkr').className=''; $('rkj').className=''; loadLeaderboard(); };
  $('rkr').onclick=function(){ rankMode='region'; selRegion=(profile&&profile.region)||'ภาคตะวันออกเฉียงเหนือ'; $('rkr').className='on'; $('rkt').className=''; $('rkj').className=''; loadLeaderboard(); };
  $('rkj').onclick=function(){ rankMode='prov'; selProv=(profile&&profile.province)||'อุบลราชธานี'; $('rkj').className='on'; $('rkt').className=''; $('rkr').className=''; loadLeaderboard(); };

  function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
  function eyeAspectRatio(lm,idx){ var p1=lm[idx[0]],p2=lm[idx[1]],p3=lm[idx[2]],p4=lm[idx[3]],p5=lm[idx[4]],p6=lm[idx[5]]; var v1=dist(p2,p6),v2=dist(p3,p5),h=dist(p1,p4); if(h<1e-6) return 1; return (v1+v2)/(2*h); }

  function onFaceResults(results){
    var canvas=$('ov'), ctx=canvas.getContext('2d'), video=$('v');
    var vw=video.videoWidth||640, vh=video.videoHeight||480;
    if(canvas.width!==vw){ canvas.width=vw; canvas.height=vh; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    faceOk=false; var closed=false;
    if(results.multiFaceLandmarks&&results.multiFaceLandmarks.length>0){
      faceOk=true; var lm=results.multiFaceLandmarks[0];
      var leftEAR=eyeAspectRatio(lm,LEFT_EYE);
      var rightEAR=eyeAspectRatio(lm,RIGHT_EYE);
      var bothClosed = (leftEAR < EAR_THRESH) && (rightEAR < EAR_THRESH);
      if(bothClosed){ closedFrames++; openFrames=0; } else { openFrames++; closedFrames=0; }
      if(closedFrames>=4) closed=true; if(openFrames>=2) closed=false; if(closedFrames<4&&openFrames<2) closed=eyesClosed;
      ctx.fillStyle=closed?'rgba(79,209,165,0.9)':'rgba(255,95,192,0.9)'; ctx.beginPath(); ctx.arc(canvas.width-30,30,12,0,Math.PI*2); ctx.fill();
    }
    eyesClosed=closed; updateSessionTick();
  }
  function updateSessionTick(){
    if(!running) return; var now=Date.now(), dt=now-lastTick; lastTick=now;
    if(faceOk&&eyesClosed){ closedMs+=dt; $('status').textContent='หลับตาแล้ว · กำลังนับเวลา'; $('status').className='status-pill run'; $('camMsg').classList.remove('show'); }
    else if(!faceOk){ $('status').textContent='ไม่เจอใบหน้า · วางกล้องให้เห็นหน้า'; $('status').className='status-pill warn'; $('camMsg').classList.add('show'); $('camMsg').innerHTML='ไม่เจอใบหน้า<br>เลื่อนมือถือให้เห็นหน้าชัด ๆ'; }
    else { $('status').textContent='ลืมตาอยู่ · ยังไม่นับเวลา'; $('status').className='status-pill warn'; $('camMsg').classList.add('show'); $('camMsg').innerHTML='หลับตาทั้งสองข้างเพื่อให้นับเวลา<br>ลืมตาข้างใดข้างหนึ่ง = หยุดนับ'; }
    $('timer').textContent=fmt(closedMs);
    var mins=Math.floor(closedMs/60000); if(mins>lastSavedMin){ var add=mins-lastSavedMin; lastSavedMin=mins; addMinutes(add); }
  }
  async function initFaceMesh(){ if(faceMesh) return; faceMesh=new FaceMesh({ locateFile:function(file){ return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+file; } }); faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5}); faceMesh.onResults(onFaceResults); }
  async function startCamera(){
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    var video=$('v'); video.srcObject=stream; await video.play(); await initFaceMesh();
    async function process(){ if(!running) return; if(video.readyState>=2) await faceMesh.send({image:video}); rafId=requestAnimationFrame(process); }
    process();
  }
  function stopCamera(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; } $('v').srcObject=null; var ctx=$('ov').getContext('2d'); ctx.clearRect(0,0,$('ov').width,$('ov').height); }

  async function startSession(){
    if(!user||!profile){ go('Acc'); return; }
    try{
      $('camMsg').classList.add('show'); $('camMsg').innerHTML='กำลังเปิดกล้อง...';
      running=true; closedMs=0; lastSavedMin=0; lastTick=Date.now(); eyesClosed=false; faceOk=false;
      $('startBtn').textContent='หยุดนั่งสมาธิ'; $('status').textContent='กำลังเริ่ม...'; $('status').className='status-pill run'; $('resetBtn').hidden=false; $('timer').textContent='00:00';
      await startCamera(); $('camMsg').classList.remove('show');
    }catch(e){ running=false; $('camMsg').innerHTML='เปิดกล้องไม่ได้: '+(e.message||e)+'<br>อนุญาตการใช้กล้องแล้วลองใหม่'; $('camMsg').classList.add('show'); $('startBtn').textContent='เริ่มนั่งสมาธิ'; $('status').textContent='พร้อมเริ่ม'; $('status').className='status-pill idle'; }
  }
  async function stopSession(skipSave){
    if(!running) return; running=false; stopCamera();
    $('startBtn').textContent='เริ่มนั่งสมาธิ'; $('status').textContent='หยุดแล้ว'; $('status').className='status-pill idle';
    $('camMsg').classList.add('show'); $('camMsg').innerHTML='กดปุ่มเริ่มด้านล่าง<br>แล้ววางมือถือให้เห็นใบหน้า<br>ระบบนับเวลาเฉพาะตอนหลับตา';
    if(!skipSave){ var fullMins=Math.floor(closedMs/60000); var remainSec=Math.floor((closedMs%60000)/1000); var add=fullMins-lastSavedMin; if(remainSec>=10) add+=1; if(add>0) await addMinutes(add); }
  }
  function resetSession(){ if(running) stopSession(true); closedMs=0; lastSavedMin=0; $('timer').textContent='00:00'; $('status').textContent='พร้อมเริ่ม'; $('status').className='status-pill idle'; $('resetBtn').hidden=true; }
  async function addMinutes(mins){
    if(!user||!profile||mins<=0) return;
    data.today=(data.today||0)+mins; data.total=(data.total||0)+mins; saveLocal(); renderHome();
    try{ var cur=await sb.from('profiles').select('total_situps').eq('id',user.id).single(); var next=((cur.data&&cur.data.total_situps)?cur.data.total_situps:0)+mins;
      await sb.from('profiles').update({total_situps:next,updated_at:new Date().toISOString()}).eq('id',user.id);
      data.total=next; if(profile) profile.total_situps=next; saveLocal(); renderHome();
      await sb.from('situp_records').insert({user_id:user.id,count:mins});
    }catch(e){ console.warn(e); }
  }
  $('startBtn').onclick=function(){ if(running) stopSession(false); else startSession(); };
  $('resetBtn').onclick=resetSession;
  function renderHome(){ $('today').textContent=Math.round(data.today||0); $('total').textContent=Math.round(data.total||0); }

  $('avBtn').onclick=function(){ $('avFile').click(); };
  $('avFile').onchange=async function(){
    var file=this.files&&this.files[0]; if(!file||!user) return;
    if(file.size>2*1024*1024){ alert('ไฟล์ใหญ่เกิน 2MB'); return; }
    try{
      $('pfAv').textContent='...';
      var ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      if(['jpg','jpeg','png','webp','gif'].indexOf(ext)<0) ext='jpg';
      var path=user.id+'/avatar.'+ext;
      var up=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});
      if(up.error) throw up.error;
      var pub=sb.storage.from('avatars').getPublicUrl(path);
      var url=pub.data.publicUrl+'?t='+Date.now();
      await sb.from('profiles').update({avatar_url:url,updated_at:new Date().toISOString()}).eq('id',user.id);
      profile.avatar_url=url;
      setAvatarEl($('pfAv'),url,(profile.username||'?')[0].toUpperCase());
    }catch(e){ alert('อัปโหลดไม่สำเร็จ: '+(e.message||e)); renderAcc(); }
    this.value='';
  };

  function closeProfile(){ var m=$('profModal'); if(m){ m.hidden=true; m.style.display='none'; } }
  function showProfile(r){
    if(!r || !r.username) return;
    setAvatarEl($('pmAv'), r.avatar_url, (r.username||'?')[0].toUpperCase());
    $('pmAv').classList.add('ring','lg');
    $('pmName').textContent = r.username || 'ไม่ระบุ';
    var reg = r.region || '';
    var prov = r.province || '';
    $('pmMeta').textContent = (prov ? prov : '') + (reg ? ' · ' + reg : '');
    var bio = (r.bio && String(r.bio).trim()) ? String(r.bio).trim() : DEFAULT_BIO;
    $('pmBio').textContent = bio;
    $('pmMins').textContent = Math.round(r.total_situps||0) + ' นาที';
    var m=$('profModal'); m.hidden=false; m.style.display='flex';
  }
  if($('pmClose')) $('pmClose').onclick = function(e){ e.stopPropagation(); closeProfile(); };
  if($('profModal')) $('profModal').onclick = function(e){ if(e.target===$('profModal')) closeProfile(); };

  function renderAcc(){
    if(user&&profile){
      $('authBox').hidden=true; $('profBox').hidden=false;
      $('pfName').textContent=profile.username||'ผู้ใช้';
      $('pfEmail').textContent=(profile.province||'') + (profile.region ? ' · '+profile.region : '');
      setAvatarEl($('pfAv'), profile.avatar_url, (profile.username||'?')[0].toUpperCase());
      $('pfAv').classList.add('ring','lg');
      $('pc').value=profile.province||'';
      if($('bioInput')) $('bioInput').value = (profile.bio && profile.bio.trim()) ? profile.bio : DEFAULT_BIO;
    } else { $('authBox').hidden=false; $('profBox').hidden=true; }
  }
  if($('bioSave')){
    $('bioSave').onclick = async function(){
      if(!user||!profile) return;
      var b = ($('bioInput').value||'').trim().slice(0,120) || DEFAULT_BIO;
      await sb.from('profiles').update({bio:b, updated_at:new Date().toISOString()}).eq('id', user.id);
      profile.bio = b;
      alert('บันทึกแล้ว');
    };
  }

  loadLocal(); renderHome();
  refreshUser().then(function(){ sb.auth.onAuthStateChange(function(){ refreshUser(); }); });
  closeProfile(); go('Home');
})();
</script>
</body>
